<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Registo - Associação de Mães do Pimentas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Registo de Entrega e Beneficiário</h1>
        <form action="alertas.html" class="form-box">
            <label for="nome">Nome do Beneficiário *</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Maria Silva">

            <label for="item">Item Entregue (ODS 2) *</label>
            <select id="item" name="item" required>
                <option value="">Selecione...</option>
                <option value="cesta">Cesta Básica</option>
                <option value="leite">Leite / Alimentos Infantis</option>
                <option value="hortifruti">Kit Hortifruti</option>
            </select>

            <button type="submit" class="btn-primary">Confirmar Registo</button>
            <a href="index.html" class="btn-secondary">Voltar ao Menu</a>
        </form>
    </main>
</body>
</html>
